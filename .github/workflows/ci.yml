name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: macOS Swift tests
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run unit tests
        run: swift test

      - name: Build release binary
        run: swift build -c release

      - name: Package signed app bundle
        run: STASHBAR_PACKAGE_ONLY=1 ./build_app.sh

      - name: Verify packaged app signature
        run: codesign --verify --deep --strict dist/StashBar.app

      - name: Check whitespace
        run: git diff --check
